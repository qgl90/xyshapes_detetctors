[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xyshapes-detectors"
version = "0.1.0"
description = "Standalone Shapely generators for detector-plane XY acceptances"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "shapely>=2.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
xyshape-box = "xyshapes_detectors.create_geom_box:main"
xyshape-velo = "xyshapes_detectors.create_geom_velo:main"
xyshape-up = "xyshapes_detectors.create_geom_up:main"
xyshape-ft = "xyshapes_detectors.create_geom_ft:main"
xyshape-all = "xyshapes_detectors.create_geom:main"

[tool.setuptools.packages.find]
where = ["src"]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UP Geometry 3D View</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17202a;
      background: #f7f8fb;
    }
    header {
      padding: 16px 20px 10px;
      background: #fff;
      border-bottom: 1px solid #d9dee7;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: #4f5f73;
      font-size: 13px;
    }
    main {
      position: relative;
      min-height: 0;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(#fbfcfe, #eef2f7);
    }
    .legend {
      position: absolute;
      right: 16px;
      top: 16px;
      padding: 10px 12px;
      border: 1px solid #d9dee7;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.92);
      font-size: 13px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <header>
    <h1>UP Geometry 3D View</h1>
    <div class="meta">
      <span>Loaded from UP/*.pickle</span>
      <span>Z positions from proto-run5-v00.02/physical/dimensions.csv</span>
      <span>Drag to rotate. Wheel to zoom.</span>
    </div>
  </header>
  <main>
    <canvas id="scene"></canvas>
    <div class="legend" id="legend"></div>
  </main>
  <script>
    const planes = [{"name": "UPaX", "z": 2317.5, "bounds": [-697.066, -640.122, 697.066, 640.122], "area": 1778714.900992, "outer": [[-697.066, -640.122], [-697.066, 640.122], [697.066, 640.122], [697.066, -640.122]], "holes": [[[38.462, 39.742], [-38.462, 39.742], [-38.462, -39.742], [38.462, -39.742]]]}, {"name": "UPaU", "z": 2372.5, "bounds": [-697.066, -640.122, 697.066, 640.122], "area": 1778714.900992, "outer": [[-697.066, -640.122], [-697.066, 640.122], [697.066, 640.122], [697.066, -640.122]], "holes": [[[38.462, 39.742], [-38.462, 39.742], [-38.462, -39.742], [38.462, -39.742]]]}, {"name": "UPbV", "z": 2597.5, "bounds": [-697.066, -640.122, 697.066, 640.122], "area": 1778714.900992, "outer": [[-697.066, -640.122], [-697.066, 640.122], [697.066, 640.122], [697.066, -640.122]], "holes": [[[38.462, 39.742], [-38.462, 39.742], [-38.462, -39.742], [38.462, -39.742]]]}, {"name": "UPbX", "z": 2652.5, "bounds": [-697.066, -640.122, 697.066, 640.122], "area": 1778714.900992, "outer": [[-697.066, -640.122], [-697.066, 640.122], [697.066, 640.122], [697.066, -640.122]], "holes": [[[38.462, 39.742], [-38.462, 39.742], [-38.462, -39.742], [38.462, -39.742]]]}];
    const colors = ["#4c82c9", "#6a9f58", "#b477c5", "#d78a4a"];
    const canvas = document.getElementById("scene");
    const context = canvas.getContext("2d");
    let yaw = -0.72;
    let pitch = 0.48;
    let zoom = 0.66;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const zCenter = planes.reduce((sum, plane) => sum + plane.z, 0) / planes.length;

    document.getElementById("legend").innerHTML = planes.map((plane, index) =>
      `<div><span style="display:inline-block;width:11px;height:11px;margin-right:6px;border:1px solid rgba(0,0,0,.25);background:${colors[index]}"></span>${plane.name} z=${plane.z} mm</div>`
    ).join("");

    function resize() {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(canvas.clientWidth * ratio);
      canvas.height = Math.floor(canvas.clientHeight * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      draw();
    }

    function rotate(point) {
      const x = point.x;
      const y = point.y;
      const z = (point.z - zCenter) * 3.2;
      const cy = Math.cos(yaw);
      const sy = Math.sin(yaw);
      const cp = Math.cos(pitch);
      const sp = Math.sin(pitch);
      const x1 = x * cy - z * sy;
      const z1 = x * sy + z * cy;
      return {x: x1, y: y * cp - z1 * sp, z: y * sp + z1 * cp};
    }

    function project(point) {
      const rotated = rotate(point);
      const distance = 3600;
      const scale = zoom * distance / (distance + rotated.z);
      return {
        x: canvas.clientWidth / 2 + rotated.x * scale,
        y: canvas.clientHeight / 2 - rotated.y * scale,
        depth: rotated.z
      };
    }

    function pathFor(points, z) {
      context.beginPath();
      points.forEach(([x, y], index) => {
        const projected = project({x, y, z});
        if (index === 0) context.moveTo(projected.x, projected.y);
        else context.lineTo(projected.x, projected.y);
      });
      context.closePath();
    }

    function drawPlane(plane, index) {
      pathFor(plane.outer, plane.z);
      context.fillStyle = colors[index] + "99";
      context.strokeStyle = "#1f2f46";
      context.lineWidth = 1.4;
      context.fill();
      context.stroke();

      plane.holes.forEach(hole => {
        pathFor(hole, plane.z);
        context.fillStyle = "#f7f8fb";
        context.fill();
        context.strokeStyle = "#9b2d2d";
        context.stroke();
      });

      const [minx, miny, maxx, maxy] = plane.bounds;
      const label = project({x: minx, y: maxy + 55, z: plane.z});
      context.fillStyle = "#17202a";
      context.font = "13px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      context.fillText(`${plane.name}  z=${plane.z} mm`, label.x, label.y);
    }

    function drawAxis() {
      const first = planes[0].z;
      const last = planes[planes.length - 1].z;
      const start = project({x: -850, y: -760, z: first});
      const end = project({x: -850, y: -760, z: last});
      context.beginPath();
      context.moveTo(start.x, start.y);
      context.lineTo(end.x, end.y);
      context.strokeStyle = "#59677a";
      context.lineWidth = 2;
      context.stroke();
      context.fillStyle = "#59677a";
      context.font = "14px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      context.fillText("z", end.x + 8, end.y);
    }

    function draw() {
      context.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      drawAxis();
      planes
        .map((plane, index) => ({plane, index, depth: rotate({x: 0, y: 0, z: plane.z}).z}))
        .sort((a, b) => b.depth - a.depth)
        .forEach(item => drawPlane(item.plane, item.index));
    }

    canvas.addEventListener("pointerdown", event => {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", event => {
      if (!dragging) return;
      yaw += (event.clientX - lastX) * 0.006;
      pitch += (event.clientY - lastY) * 0.006;
      pitch = Math.max(-1.2, Math.min(1.2, pitch));
      lastX = event.clientX;
      lastY = event.clientY;
      draw();
    });
    canvas.addEventListener("pointerup", () => {
      dragging = false;
    });
    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      zoom *= event.deltaY > 0 ? 0.92 : 1.08;
      zoom = Math.max(0.25, Math.min(1.6, zoom));
      draw();
    }, {passive: false});
    window.addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>

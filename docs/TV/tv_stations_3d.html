<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Detector 3D Layout</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fb;
      color: #17202a;
    }
    header {
      padding: 16px 20px 10px;
      background: #fff;
      border-bottom: 1px solid #d9dee7;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: #4f5f73;
      font-size: 13px;
    }
    main {
      position: relative;
      min-height: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(#fbfcfe, #eef2f7);
    }
    .legend {
      position: absolute;
      right: 16px;
      top: 16px;
      padding: 10px 12px;
      border: 1px solid #d9dee7;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.92);
      font-size: 13px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <header>
    <h1>TV Detector 3D Layout</h1>
    <div class="meta">
      <span>20 layers from z = 0 to 780 mm</span>
      <span>50 x 50 mm square, 7.2 x 7.2 mm centered hole</span>
      <span>Each XY surface rotated 45 degrees about z</span>
    </div>
  </header>

    <div class="legend">

      <div>Wheel to zoom</div>

    </div>
  </main>

": 574.7368421052631, "outer": [[-3.552713678800501e-15, -35.35533905932738], [-35.35533905932738, 3.552713678800501e-15], [3.552713678800501e-15, 35.35533905932738], [35.35533905932738, -3.552713678800501e-15]], "holes": [[[4.440892098500626e-16, 5.091168824543143], [-5.091168824543143, 4.440892098500626e-16], [-4.440892098500626e-16, -5.091168824543143], [5.091168824543143, -4.440892098500626e-16]]]}, {"name": "TV15", "z": 615.7894736842105, "outer": [[-3.552713678800501e-15, -35.35533905932738], [-35.35533905932738, 3.552713678800501e-15], [3.552713678800501e-15, 35.35533905932738], [35.35533905932738, -3.552713678800501e-15]], "holes": [[[4.440892098500626e-16, 5.091168824543143], [-5.091168824543143, 4.440892098500626e-16], [-4.440892098500626e-16, -5.091168824543143], [5.091168824543143, -4.440892098500626e-16]]]}, {"name": "TV16", "z": 656.8421052631579, "outer": [[-3.552713678800501e-15, -35.35533905932738], [-35.35533905932738, 3.552713678800501e-15], [3.552713678800501e-15, 35.35533905932738], [35.35533905932738, -3.552713678800501e-15]], "holes": [[[4.440892098500626e-16, 5.091168824543143], [-5.091168824543143, 4.440892098500626e-16], [-4.440892098500626e-16, -5.091168824543143], [5.091168824543143, -4.440892098500626e-16]]]}, {"name": "TV17", "z": 697.8947368421053, "outer": [[-3.552713678800501e-15, -35.35533905932738], [-35.35533905932738, 3.552713678800501e-15], [3.552713678800501e-15, 35.35533905932738], [35.35533905932738, -3.552713678800501e-15]], "holes": [[[4.440892098500626e-16, 5.091168824543143], [-5.091168824543143, 4.440892098500626e-16], [-4.440892098500626e-16, -5.091168824543143], [5.091168824543143, -4.440892098500626e-16]]]}, {"name": "TV18", "z": 738.9473684210527, "outer": [[-3.552713678800501e-15, -35.35533905932738], [-35.35533905932738, 3.552713678800501e-15], [3.552713678800501e-15, 35.35533905932738], [35.35533905932738, -3.552713678800501e-15]], "holes": [[[4.440892098500626e-16, 5.091168824543143], [-5.091168824543143, 4.440892098500626e-16], [-4.440892098500626e-16, -5.091168824543143], [5.091168824543143, -4.440892098500626e-16]]]}, {"name": "TV19", "z": 780.0, "outer": [[-3.552713678800501e-15, -35.35533905932738], [-35.35533905932738, 3.552713678800501e-15], [3.552713678800501e-15, 35.35533905932738], [35.35533905932738, -3.552713678800501e-15]], "holes": [[[4.440892098500626e-16, 5.091168824543143], [-5.091168824543143, 4.440892098500626e-16], [-4.440892098500626e-16, -5.091168824543143], [5.091168824543143, -4.440892098500626e-16]]]}];
    const canvas = document.getElementById("scene");
    const context = canvas.getContext("2d");
    let yaw = -0.74;
    let pitch = 0.48;
    let zoom = 7.0;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const zCenter = 390;

    function resize() {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(canvas.clientWidth * ratio);
      canvas.height = Math.floor(canvas.clientHeight * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      draw();
    }

    function rotate(point) {
      const x = point.x;
      const y = point.y;
      const z = point.z - zCenter;
      const cy = Math.cos(yaw);
      const sy = Math.sin(yaw);
      const cp = Math.cos(pitch);
      const sp = Math.sin(pitch);
      const x1 = x * cy - z * sy;
      const z1 = x * sy + z * cy;
      return {x: x1, y: y * cp - z1 * sp, z: y * sp + z1 * cp};
    }

    function project(point) {
      const rotated = rotate(point);
      const distance = 2500;
      const scale = zoom * distance / (distance + rotated.z);
      return {
        x: canvas.clientWidth / 2 + rotated.x * scale,
        y: canvas.clientHeight / 2 - rotated.y * scale,
        depth: rotated.z
      };
    }

    function pathFor(points, z) {
      context.beginPath();
      points.forEach(([x, y], index) => {
        const projected = project({x, y, z});
        if (index === 0) context.moveTo(projected.x, projected.y);
        else context.lineTo(projected.x, projected.y);
      });
      context.closePath();
    }

    function drawStation(station, index) {
      const alpha = 0.22 + 0.46 * index / (stations.length - 1);
      pathFor(station.outer, station.z);
      context.fillStyle = `rgba(76, 130, 201, ${alpha})`;
      context.strokeStyle = "#1f2f46";
      context.lineWidth = 1.2;
      context.fill();
      context.stroke();

      station.holes.forEach(hole => {
        pathFor(hole, station.z);
        context.fillStyle = "#f7f8fb";
        context.fill();
        context.strokeStyle = "#9b2d2d";
        context.lineWidth = 1.0;
        context.stroke();
      });

      if (index === 0 || index === stations.length - 1) {
        const label = project({x: 42, y: 42, z: station.z});
        context.fillStyle = "#17202a";
        context.font = "13px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        context.fillText(`${station.name}  z=${station.z.toFixed(1)} mm`, label.x, label.y);
      }
    }

    function drawAxis() {
      const start = project({x: -58, y: -58, z: 0});
      const end = project({x: -58, y: -58, z: 780});
      context.beginPath();
      context.moveTo(start.x, start.y);
      context.lineTo(end.x, end.y);
      context.strokeStyle = "#59677a";
      context.lineWidth = 2.5;
      context.stroke();
      context.fillStyle = "#59677a";
      context.font = "14px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      context.fillText("z", end.x + 8, end.y);
    }

    function draw() {
      context.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      drawAxis();
      stations
        .map((station, index) => ({station, index, depth: rotate({x: 0, y: 0, z: station.z}).z}))
        .sort((a, b) => b.depth - a.depth)
        .forEach(item => drawStation(item.station, item.index));
    }

    canvas.addEventListener("pointerdown", event => {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", event => {
      if (!dragging) return;
      yaw += (event.clientX - lastX) * 0.006;
      pitch += (event.clientY - lastY) * 0.006;
      pitch = Math.max(-1.2, Math.min(1.2, pitch));
      lastX = event.clientX;
      lastY = event.clientY;
      draw();
    });

    canvas.addEventListener("pointerup", () => {
      dragging = false;
    });

    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      zoom *= event.deltaY > 0 ? 0.92 : 1.08;
      zoom = Math.max(2.5, Math.min(18, zoom));
      draw();
    }, {passive: false});

    window.addEventListener("resize", resize);
    resize();
  </script>

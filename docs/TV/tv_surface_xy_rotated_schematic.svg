<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620">
  <rect width="100%" height="100%" fill="#f7f8fb" />
  <text x="32" y="40" fill="#17202a" font-size="22" font-family="Arial, sans-serif" font-weight="700">TV surface in global XY</text>
  <text x="32" y="64" fill="#4f5f73" font-size="13" font-family="Arial, sans-serif">50 x 50 mm active square with 7.2 x 7.2 mm centered hole, after 45 degree rotation about the z axis</text>

  <line x1="90" y1="310" x2="630" y2="310" stroke="#59677a" stroke-width="1.3" stroke-dasharray="6 6" />
  <line x1="360" y1="580" x2="360" y2="100" stroke="#59677a" stroke-width="1.3" stroke-dasharray="6 6" />
  <text x="638" y="314" fill="#59677a" font-size="14" font-family="Arial, sans-serif" font-weight="700">x</text>
  <text x="365" y="94" fill="#59677a" font-size="14" font-family="Arial, sans-serif" font-weight="700">y</text>

  <polygon points="360,110 560,310 360,510 160,310"
           fill="#4c82c9" fill-opacity="0.72" stroke="#1f2f46" stroke-width="2.4" />
  <polygon points="360,286 384,310 360,334 336,310"
           fill="#f7f8fb" stroke="#9b2d2d" stroke-width="2.2" />

  <path d="M 465 205 A 148 148 0 0 1 508 310" fill="none" stroke="#9b6a2f" stroke-width="2" />
  <path d="M 508 310 l -9 -15 m 9 15 l -14 10" fill="none" stroke="#9b6a2f" stroke-width="2" />
  <text x="480" y="220" fill="#9b6a2f" font-size="14" font-family="Arial, sans-serif" font-weight="700">45 deg</text>

  <text x="170" y="540" fill="#17202a" font-size="13" font-family="Arial, sans-serif">Outer: 50 x 50 mm; inner hole: 7.2 x 7.2 mm</text>
  <text x="170" y="562" fill="#4f5f73" font-size="12" font-family="Arial, sans-serif">This is the global-frame XY surface to replicate along z.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="36" y="48" font-family="Arial, sans-serif" font-size="28" fill="#1f2937" font-weight="700">Simplified RICH radiator volumes</text>
<text x="36" y="78" font-family="Arial, sans-serif" font-size="15" fill="#475569" font-weight="400">Each RICH is represented by an entry plane and an exit plane enclosing the radiator region.</text>
<text x="70" y="126" font-family="Arial, sans-serif" font-size="18" fill="#1f2937" font-weight="700">RICH1: z 795.0 to 2237.2 mm</text>
<text x="70" y="150" font-family="Arial, sans-serif" font-size="13" fill="#475569" font-weight="400">exit XY size 1384.1 x 1142.5 mm</text>
<text x="70" y="166" font-family="Arial, sans-serif" font-size="13" fill="#475569" font-weight="400">thetaX 25-300 mrad, thetaY 25-250 mrad</text>
<text x="70" y="184" font-family="Arial, sans-serif" font-size="11" fill="#475569" font-weight="400">Projective RICH1 proxy: wide-angle LHCb RICH coverage.</text>
<rect x="70.00" y="180.06" width="430.00" height="354.94" fill="#0891b2" fill-opacity="0.32" stroke="#0891b2" stroke-width="2"/>
<rect x="267.08" y="339.78" width="35.83" height="35.49" fill="#f8fafc" stroke="#8b1e1e" stroke-width="1.5"/>
<text x="78.0" y="202.05606354377326" font-family="Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="400">exit plane footprint; entry is smaller by z scaling</text>
<text x="600" y="126" font-family="Arial, sans-serif" font-size="18" fill="#1f2937" font-weight="700">RICH2: z 9487.5 to 11839.2 mm</text>
<text x="600" y="150" font-family="Arial, sans-serif" font-size="13" fill="#475569" font-weight="400">exit XY size 2855.1 x 2375.8 mm</text>
<text x="600" y="166" font-family="Arial, sans-serif" font-size="13" fill="#475569" font-weight="400">thetaX 15-120 mrad, thetaY 15-100 mrad</text>
<text x="600" y="184" font-family="Arial, sans-serif" font-size="11" fill="#475569" font-weight="400">Projective RICH2 proxy: low-angle LHCb RICH coverage.</text>
<rect x="600.00" y="177.19" width="430.00" height="357.81" fill="#0f766e" fill-opacity="0.32" stroke="#0f766e" stroke-width="2"/>
<rect x="788.12" y="329.26" width="53.75" height="53.67" fill="#f8fafc" stroke="#8b1e1e" stroke-width="1.5"/>
<text x="608.0" y="199.19484038846883" font-family="Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="400">exit plane footprint; entry is smaller by z scaling</text>
</svg>
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 50000);
camera.position.set(5200, -7200, 5600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 7000);
controls.update();
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const group = new THREE.Group();
const zScale = 0.55;
for (const layer of layers) {
  const [xmin, ymin, xmax, ymax] = layer.bounds;
  const geom = new THREE.PlaneGeometry(xmax - xmin, ymax - ymin);
  const mat = new THREE.MeshBasicMaterial({ color: layer.color, transparent: true, opacity: 0.22, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set((xmin + xmax) / 2, (ymin + ymax) / 2, layer.z * zScale);
  group.add(mesh);
  const edge = new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: layer.color }));
  edge.position.copy(mesh.position);
  group.add(edge);
}
scene.add(group);
document.getElementById('info').innerHTML = Object.entries(layers.reduce((a,l)=>(a[l.detector]=(a[l.detector]||0)+1,a),{}))

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);

function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }

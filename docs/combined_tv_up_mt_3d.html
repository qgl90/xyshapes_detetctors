      const sp = Math.sin(pitch);
      const x1 = x * cy - z * sy;
      const z1 = x * sy + z * cy;
      return {x: x1, y: y * cp - z1 * sp, z: y * sp + z1 * cp};
    }

    function project(point) {
      const rotated = rotate(point);
      const distance = 7800;
      const scale = zoom * distance / (distance + rotated.z);
      return {
        x: canvas.clientWidth / 2 + rotated.x * scale,
        y: canvas.clientHeight / 2 - rotated.y * scale,
        depth: rotated.z
      };
    }

    function pathFor(points, z) {
      context.beginPath();
      points.forEach(([x, y], index) => {
        const projected = project({x, y, z});
        if (index === 0) context.moveTo(projected.x, projected.y);
        else context.lineTo(projected.x, projected.y);
      });
      context.closePath();
    }

    function drawSurface(surface) {
      pathFor(surface.outer, surface.z);
      const alpha = surface.family === "TV" ? 0.28 : surface.family === "UP" ? 0.58 : surface.family === "MUON" ? 0.30 : 0.40;
      context.fillStyle = surface.color + Math.round(alpha * 255).toString(16).padStart(2, "0");
      context.strokeStyle = "#1f2f46";
      context.lineWidth = surface.family === "MT" ? 1.0 : 1.3;
      context.fill();
      context.stroke();

      surface.holes.forEach(hole => {
        pathFor(hole, surface.z);
        context.fillStyle = "#f7f8fb";
        context.fill();
        context.strokeStyle = "#9b2d2d";
        context.lineWidth = 1;
        context.stroke();
      });

      const shouldLabel = surface.family !== "TV" || surface.name === "TV00" || surface.name === "TV19";
      if (shouldLabel) {
        const [minx, , , maxy] = surface.bounds;
        const label = project({x: minx, y: maxy + 95, z: surface.z});
        context.fillStyle = "#17202a";
        context.font = "12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        context.fillText(`${surface.name}  z=${surface.z.toFixed(1)} mm`, label.x, label.y);
      }
    }

    function drawAxis() {
      const start = project({x: -3400, y: -2450, z: 0.0});
      const end = project({x: -3400, y: -2450, z: 18870.0});
      context.beginPath();
      context.moveTo(start.x, start.y);
      context.lineTo(end.x, end.y);
      context.strokeStyle = "#59677a";
      context.lineWidth = 2.5;
      context.stroke();
      context.fillStyle = "#59677a";
      context.font = "14px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      context.fillText("z", end.x + 8, end.y);
    }

    function draw() {
      context.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      drawAxis();
      surfaces
        .map(surface => ({surface, depth: rotate({x: 0, y: 0, z: surface.z}).z}))
        .sort((a, b) => b.depth - a.depth)
        .forEach(item => drawSurface(item.surface));
    }

    canvas.addEventListener("pointerdown", event => {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", event => {
      if (!dragging) return;
      yaw += (event.clientX - lastX) * 0.006;
      pitch += (event.clientY - lastY) * 0.006;
      pitch = Math.max(-1.2, Math.min(1.2, pitch));
      lastX = event.clientX;
      lastY = event.clientY;
      draw();
    });
    canvas.addEventListener("pointerup", () => {
      dragging = false;
    });
    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      zoom *= event.deltaY > 0 ? 0.92 : 1.08;
      zoom = Math.max(0.035, Math.min(0.55, zoom));
      draw();
    }, {passive: false});
    window.addEventListener("resize", resize);
    resize();
  </script>
</body>
</html>
